version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: chleba_smak_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chleba_smak_dev
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: chleba_smak_adminer
    ports:
      - "8080:8080"

volumes:
  db_data:
