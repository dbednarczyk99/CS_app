
services:
  db:
    image: mysql:8.0
    container_name: chleba_smak_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chleba_smak_dev
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: chleba_smak_adminer
    ports:
      - "8080:8080"

  # Skrzynka testowa: przechwytuje wszystkie maile wysyłane lokalnie (podgląd: http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.21.0
    container_name: chleba_smak_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
